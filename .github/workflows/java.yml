name: Java backend
on:
  push:
    paths:
      - 'backend-java/**'
      - 'docker-compose.yml'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'backend-java/**'
      - 'docker-compose.yml'
      - '.github/workflows/java.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker for Testcontainers
        run: docker info
      - name: Verify unit, architecture, Flyway and Testcontainers integration tests
        working-directory: backend-java
        run: ./mvnw -B clean verify
      - name: Validate Phase 1 Compose
        run: docker compose --env-file .env.example config --quiet
