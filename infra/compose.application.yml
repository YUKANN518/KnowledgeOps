# Future application topology. Requires real images from Phase 7; not runnable in Phase 0.
# docker compose --env-file .env -f docker-compose.yml -f infra/compose.application.yml up -d
services:
  frontend:
    image: ${FRONTEND_IMAGE:-knowledgeops/frontend:dev}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    networks: [web]
    depends_on:
      java-backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
  java-backend:
    image: ${JAVA_IMAGE:-knowledgeops/java-backend:dev}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-knowledgeops}?connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-knowledgeops}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      JAVA_TO_AI_TOKEN: ${JAVA_TO_AI_TOKEN:?Set JAVA_TO_AI_TOKEN}
      AI_TO_JAVA_TOKEN: ${AI_TO_JAVA_TOKEN:?Set AI_TO_JAVA_TOKEN}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET}
      STORAGE_ROOT: /data/documents
      INTERNAL_PORT: "8081"
    volumes:
      - document-files:/data/documents
    networks: [web, service-internal, business-data]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
  ai-service:
    image: ${AI_IMAGE:-knowledgeops/ai-service:dev}
    environment:
      JAVA_INTERNAL_URL: http://java-backend:8081/internal/ai
      JAVA_TO_AI_TOKEN: ${JAVA_TO_AI_TOKEN:?Set JAVA_TO_AI_TOKEN}
      AI_TO_JAVA_TOKEN: ${AI_TO_JAVA_TOKEN:?Set AI_TO_JAVA_TOKEN}
      QDRANT_URL: http://vector-store:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      STORAGE_ROOT: /data/documents
      LLM_MODE: ${LLM_MODE:-fake}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - document-files:/data/documents:ro
      - model-cache:/data/models
    networks: [service-internal, ai-data, ai-egress]
    depends_on:
      vector-store:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 3g
    cpus: 2
networks:
  web:
  service-internal:
    internal: true
  ai-egress:
volumes:
  document-files:
  model-cache:
