name: Architecture contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-architecture.txt
      - run: pip install -r scripts/requirements-architecture.txt
      - run: python scripts/validate_architecture.py
      - run: python scripts/build_contracts.py
      - run: git diff --exit-code -- docs/contracts
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f infra/compose.application.yml config --quiet
